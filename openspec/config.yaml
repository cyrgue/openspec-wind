schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Git branching: for every new change/proposal created with `openspec new
  change <change-name>`, create and check out a new git branch before writing
  any planning artifacts (proposal, specs, design, tasks). Branch name format:
    feature/FT-XXX-<change-name>
  - <change-name> is the change's kebab-case name (the same name passed to
    `openspec new change`).
  - XXX is a zero-padded 3-digit number, starting at 002 and incrementing by 1
    for each new change. Determine the next number by finding the highest
    existing feature/FT-XXX-* branch (local and remote) and adding 1; if none
    exist yet, start at 002.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
